- type: entity
  parent: [ MobDragonDungeon ]
  id: MobDragonSotek
  suffix: ""
  name: Sotek
  description: God of reptiles
  components:
  - type: RandomSprite
    available:
    - enum.DamageStateVisualLayers.Base:
        alive: Sotek
  - type: Sprite
    sprite: _HL/Mobs/Characters/Sotek.rsi
    noRot: true
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: alive
    - map: [ "enum.DamageStateVisualLayers.BaseUnshaded" ]
      state: alive-unshaded
      shader: unshaded
  - type: Prying
    pryPowered: true
    force: true
    speedModifier: 20 # fast because dragon strong
    useSound:
      path: /Audio/Items/crowbar.ogg
  - type: ActionGun
    action: ActionDragonsBreath
    gunProto: SoteksBreathGun
  - type: CumProducer
    maxVol: 15000
    reVol: 3750
    reHunger: 1
  - type: Tag
    tags:
    - CanPilot
    - FootstepSound
    - DoorBumpOpener
    - CannotSuicide
    - ResinStructures
  - type: ThermalVision # Starlight
  - type: Vore
  - type: TrapAvoider
  - type: NpcFactionMember
    factions:
    - PetsNT
  - type: Insulated
  - type: Access
  - type: ComplexInteraction
  - type: Inventory
    templateId: friendxeno
  - type: IdExaminable
  - type: InventorySlots
  - type: Stripping
  - type: Strippable
  - type: UserInterface
    interfaces:
      enum.StrippingUiKey.Key:
        type: StrippableBoundUserInterface
  - type: Puller
    needsHands: false

- type: entity
#  categories: [ HideSpawnMenu ]
  id: SoteksBreathGun
  name: Soteks breath
  description: For dragon's breathing.
  components:
  - type: HitscanBatteryAmmoProvider
    proto: SotekBeam # Frontier: use NF variant
    fireCost: 900
  - type: BatterySelfRecharger
    autoRecharge: true
    autoRechargeRate: 50
  - type: Battery
    maxCharge: 1000
    startingCharge: 1000
  - type: Gun
    soundGunshot: /Audio/Effects/holy.ogg
    projectileSpeed: 5

- type: entity
  parent: [ MobDragonDungeon ]
  id: MobDragonThalmyr
  suffix: ""
  name: Thalmyr
  description: Space dragon
  components:
  - type: Sprite
    sprite: _HL/Mobs/Characters/thalmyr.rsi
    noRot: true
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: alive
    - map: [ "enum.DamageStateVisualLayers.BaseUnshaded" ]
      state: alive-unshaded
      shader: unshaded
  - type: MobThresholds
    thresholds:
      0: Alive
      200: Critical
      250: Dead
  - type: CumProducer
    maxVol: 15000
    reVol: 3750
    reHunger: 1
  - type: Tag
    tags:
    - CanPilot
    - FootstepSound
    - DoorBumpOpener
    - CannotSuicide
    - ResinStructures
  - type: ThermalVision # Starlight
  - type: Vore
  - type: TrapAvoider
  - type: NpcFactionMember
    factions:
    - PetsNT
  - type: Insulated
  - type: Access
  - type: ComplexInteraction
  - type: Inventory
    templateId: friendxeno
  - type: IdExaminable
  - type: InventorySlots
  - type: Stripping
  - type: Strippable
  - type: UserInterface
    interfaces:
      enum.StrippingUiKey.Key:
        type: StrippableBoundUserInterface
  - type: Puller
    needsHands: false
  - type: ActionGun
    action: ActionDragonsBreath
    gunProto: DragonsBreathGun