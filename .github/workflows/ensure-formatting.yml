name: Flake Check(s)

on:
  push:
    branches:
    - master
  pull_request:
    branches:
    - master

jobs:
  flake-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=channel:nixos-unstable
    - name: Run flake checks
      run: nix flake check
