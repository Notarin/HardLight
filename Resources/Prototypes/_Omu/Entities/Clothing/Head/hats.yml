- type: entity
  parent: ClothingHeadBase # HardLight
  id: ClothingHeadHatUshankaBlueshield
  name: blueshield's armored ushanka
  description: Perfect for saving heads in Siberia, da?
  # HardLight: Cosmetic only.
  components:
  - type: Clothing
    sprite: _Goobstation/Clothing/Head/Hats/blueshield_ushanka.rsi
