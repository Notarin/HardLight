name: Publish Testing
concurrency:
  group: publish-testing

on:
  workflow_dispatch:
#   schedule: # Frontier: disable auto-schedule
#   - cron: '0 10 * * *'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Setup .NET Core
      uses: ./.github/actions/setup-dotnet

    - name: Get Engine Tag
      run: |
        cd RobustToolbox
        git fetch --depth=1

    - name: Install dependencies
      run: dotnet restore

    - name: Build Packaging
      run: dotnet build Content.Packaging --configuration Release --no-restore /m

    - name: Package server
      run: dotnet run --project Content.Packaging server --platform win-x64 --platform linux-x64 --platform osx-x64 --platform linux-arm64

    - name: Package client
      run: dotnet run --project Content.Packaging client --no-wipe-release

    - name: Set up Python 3.10
      run: |
        apt update
        apt install -y python3-pip
        pip3 install --ignore-installed --user pillow requests

    - name: Publish version
      run: Tools/publish_multi_request.py --fork-id wizards-testing
      env:
        PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        FORGEJO_REPOSITORY: ${{ vars.FORGEJO_REPOSITORY }}
