name: "Labels: Size"

concurrency:
  group: labels
  cancel-in-progress: false

on: pull_request_target


jobs:
  size-label:
    runs-on: ubuntu-latest
    steps:
      - name: size-label
        uses: "https://github.com/pascalgn/size-label-action@v0.5.5"
        env:
          GITHUB_TOKEN: "${{ env.FORGEJO_TOKEN }}"
        with:
          # Custom size configuration
          sizes: >
            {
              "0": "XS",
              "10": "S",
              "100": "M",
              "1000": "L",
              "5000": "XL"
            }
