- type: reagent
  id: Nanites
  name: reagent-name-nanites
  group: Medicine
  desc: reagent-desc-nanites
  physicalDesc: reagent-physical-desc-glowing
  contrabandSeverity: Minor
  flavor: metallic
  color: "#8AFFFd"
  recognizable: true
  worksOnTheDead: true
  reactiveEffects:
    Acidic:
      methods: [ Touch ]
      effects:
      - !type:HealthChange
        ignoreResistances: false
        conditions:
        - !type:HasTag
          tag: Synth
          invert: true
        damage:
          types:
            Slash: 0.3
            Piercing: 0.2
            Blunt: 0.1
      - !type:Emote
        emote: Scream
        probability: 0.1
  metabolisms:
    Medicine:
      effects:
      - !type:HealthChange
        conditions:
        - !type:OrganType
          type: Synth
        - !type:ReagentThreshold
          reagent: Nanites
          max: 10
        damage:
          groups:
            Brute: -10 # -3 after modifiers
            Burn: -15 # -4 after modifiers
            Toxin: -10 # -3 after modifiers
          types:
            Bloodloss: -3 # -0.9 after modifiers
            Cellular: -5 # -1.5 after modifiers
      - !type:ModifyBleedAmount
        conditions:
        - !type:OrganType
          type: Synth
        - !type:ReagentThreshold
          reagent: Nanites
          max: 10
        amount: -1.25 # -0.375 after modifiers
      - !type:ModifyBloodLevel
        conditions:
        - !type:OrganType
          type: Synth
        - !type:ReagentThreshold
          reagent: Nanites
          max: 10
        amount: 5 # 1.5 after modifiers
      # OD
      - !type:HealthChange
        conditions:
        - !type:OrganType
          type: Synth
        - !type:ReagentThreshold
          reagent: Nanites
          min: 10
        damage:
          groups:
            Brute: 5 # 1.5 after modifiers
      - !type:ModifyBleedAmount
        conditions:
        - !type:ReagentThreshold
          reagent: Nanites
          min: 10
        - !type:OrganType
          type: Synth
        amount: 0.5 # 0.15 after modifiers
      - !type:Jitter
        conditions:
        - !type:OrganType
          type: Synth
        - !type:ReagentThreshold
          reagent: Nanites
          min: 10
    Poison:
      effects:
      - !type:HealthChange
        conditions:
        - !type:OrganType
          type: Synth
          shouldHave: false
        damage:
          groups:
            Brute: 6
      - !type:Emote
        conditions:
        - !type:OrganType
          type: Synth
          shouldHave: false
        emote: Scream
        probability: 0.2
  footstepSound:
    collection: FootstepBlood
    params:
      volume: 6
