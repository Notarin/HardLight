  components:
  - type: Explosive
    explosionType: Default
    maxIntensity: 15
    intensitySlope: 3
    totalIntensity: 120 # about a ~4 tile radius
    canCreateVacuum: false
    
- type: entity
  name: syndicate minibomb
  description: A syndicate-manufactured explosive used to stow destruction and cause chaos.
  parent: [SyndieMiniBomb] # Frontier: BaseSyndicateContraband<BaseC3SyndicateContraband
  id: SSyndieMiniBomb
  components:
  - type: Explosive
    explosionType: Minibomb
    totalIntensity: 200
    intensitySlope: 30 #Will destroy the tile under it reliably, space 1-2 more to rods. Only does any significant damage in a 5-tile cross.
    maxIntensity: 90
    
- type: entity
  name: composition C-4
  description: Used to put holes in specific areas without too much extra hole. A saboteur's favorite.
  parent: [C4] # Frontier: BaseSyndicateContraband<BaseC3SyndicateContraband
