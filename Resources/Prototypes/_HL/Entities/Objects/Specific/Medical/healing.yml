- type: entity
  name: painkiller pill
  parent: Pill
  id: PillPainkillers
  components:
  - type: Pill
    pillType: 9
  - type: Sprite
    state: pill10
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 20
        reagents:
        - ReagentId: Painkillers
          Quantity: 20

- type: entity
  name: over-the-counter painkillers
  description: Contains ten painkillers. Do not take with alcohol. © LRSI Medical 2526.
  parent: PillCanister
  id: PillCanisterPainkillers
  components:
  - type: StorageFill
    contents:
    - id: PillPainkillers
      amount: 10

- type: entity
  name: synth blood pack
  description: Contains fullerene, a synthetic, carbon-based blood solution used by Synths.
  parent: BaseHealingItem
  id: SynthBloodpack
  suffix: Full
  components:
  - type: Item
    sprite: _HL/Objects/Specific/Medical/medical.rsi
    heldPrefix: synthpack
  - type: Tag
    tags:
    - Bloodpack
  - type: Sprite
    sprite: _HL/Objects/Specific/Medical/medical.rsi
    state: synthpack
  - type: Healing
    damageContainers:
    - Synth
    damage:
      types:
        Bloodloss: -8.33 # equals roughly 2.5 after modifiers; was 1.67 (roughly 0.5 after modifiers) but buffed to meet HL standards
    delay: 1.6
    ModifyBloodLevel: 30 # was 15; buffed to meet HL standards
    healingBeginSound:
      path: "/Audio/Items/Medical/brutepack_begin.ogg"
      params:
        volume: 1.0
        variation: 0.125
    healingEndSound:
      path: "/Audio/Items/Medical/brutepack_end.ogg"
      params:
        volume: 1.0
        variation: 0.125
  - type: Stack
    stackType: SynthBloodpack
    count: 10
  - type: StackPrice
    price: 10

- type: entity
  parent: SynthBloodpack
  id: SynthBloodpack1
  suffix: Single
  components:
  - type: Stack
    stackType: SynthBloodpack
    count: 1
