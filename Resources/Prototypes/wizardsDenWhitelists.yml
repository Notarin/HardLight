# This is the whitelist used for Wizard's Den Salamander

- type: playerConnectionWhitelist
  id: salamanderMrpWhitelist
  conditions:
  - !type:ConditionManualBlacklistMembership
    action: Deny # Deny blacklisted (MRP ban)
  - !type:ConditionNotesPlaytimeRange
    includeExpired: false # Deny for high severity notes in the last 30 days
    minimumSeverity: 3 # High
    minimumNotes: 1
    range: 30 # 30 days
    action: Deny
    includeSecret: false
  - !type:ConditionNotesPlaytimeRange
    includeExpired: false # Deny for >=3 medium severity notes in the last 90 days
    minimumSeverity: 2 # Medium
    minimumNotes: 3
    range: 90 # 90 Days
    action: Deny
    includeSecret: false
    #  - !type:ConditionNotesPlaytimeRange # Deny for >=3 low severity notes in the last 14 days
    #    includeExpired: false
    #    minimumSeverity: 1 # Low
    #    minimumNotes: 3
    #    range: 14 # 14 Days
    #    action: Deny
    #    includeSecret: false
  - !type:ConditionManualWhitelistMembership
    action: Allow # Allow whitelisted players
  - !type:ConditionPlayerCount
    minimumPlayers: 0 # Allow when <= 15 players are online
    maximumPlayers: 15
    action: Allow
  - !type:ConditionAlwaysMatch
    #- !type:ConditionPlaytime
    #  minimumPlaytime: 1200 # 20 hours to be whitelisted
    #  action: Deny
    action: Deny
