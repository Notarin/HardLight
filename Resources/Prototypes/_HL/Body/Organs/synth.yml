- type: entity
  id: BaseSynthOrgan
  parent: BaseItem
  abstract: true
  components:
  - type: Sprite
    sprite: _HL/Mobs/Species/Synth/organs.rsi
  - type: Organ
  - type: PreservesSpoilage
  - type: SynthOrgan
  - type: Extractable
    grindableSolutionName: organ
  - type: SolutionContainerManager
    solutions:
      organ:
        reagents:
        - ReagentId: Nanites
          Quantity: 10
  - type: Item
    size: Small

- type: entity
  id: OrganSynthBrain
  parent: BaseItem
  name: synth ccu
  suffix: Synth
  description: "Effectively a Synth's brain. It's somehow smoother than yours."
  components:
  - type: LanguageSpeaker
  - type: LanguageKnowledge
    speaks:
    - GalacticCommon
    - Machine
    understands:
    - GalacticCommon
    - Machine
  - type: Sprite
    sprite: _HL/Mobs/Species/Synth/organs.rsi
    state: synth_ccu
    scale: 0.65, 0.65
  - type: Organ
  - type: SynthOrgan
    slotId: brain
  - type: Brain
  - type: Input
    context: "ghost"
  - type: InputMover
  - type: Examiner
  - type: BlockMovement
  - type: OrganBrainSynth
  - type: BorgBrain
  - type: Tag
    tags:
    - MindTransferTarget
    - CannotSuicide

- type: entity
  id: OrganSynthEyes
  parent: BaseSynthOrgan
  name: camera gimbal
  suffix: Synth
  description: "A small mechanical gimbal featuring several multi-spectrum cameras, responsible for Synth vision."
  components:
  - type: Organ
    slotId: eyes
  - type: Eyes
  - type: OrganEyesSynth
  - type: Sprite
    state: synth_camera_gimbal
    scale: 0.8, 0.8

- type: entity
  id: OrganSynthTongue
  parent: BaseSynthOrgan
  name: synth tongue
  suffix: Synth
  description: "It's a tongue, capable of unspeakable things."
  components:
  - type: Sprite
    state: synth_tongue

- type: entity
  id: OrganSynthAppendix
  parent: BaseSynthOrgan
  name: red brick
  suffix: Synth
  description: "If you see this, it's already too late. I'm sorry."
  components:
  - type: Organ
    slotId: appendix
  - type: Sprite
    state: synth_red_brick
    scale: 0.6, 0.6

- type: entity
  id: OrganSynthEars
  parent: BaseSynthOrgan
  name: audio pack
  suffix: Synth
  description: "A sensor pack designed to be installed in a Synth. This one contains audio sensors."
  components:
  - type: Organ
    slotId: ears
  - type: Ears
  - type: Sprite
    state: synth_audio_pack
    scale: 0.7, 0.7

- type: entity
  id: OrganSynthLungs
  parent: BaseSynthOrgan
  name: synth lungs
  suffix: Synth
  description: "Synth lungs simulating organic functions for internal cooling. Not very interesting on their own."
  components:
  - type: Organ
    slotId: lungs
  - type: Sprite
    state: synth_lungs
  - type: Lung
  - type: OrganLungsSynth
  - type: Metabolizer
    solutionOnBody: false
    solution: "Lung"
    metabolizerTypes: [ Synth ]
    groups:
    - id: Gas
      rateModifier: 100.0
  - type: SolutionContainerManager
    solutions:
      organ:
        reagents:
        - ReagentId: Nanites
          Quantity: 10
      Lung:
        maxVol: 100.0
        canReact: false

- type: entity
  id: OrganSynthHeart
  parent: BaseSynthOrgan
  name: synth heart
  suffix: Synth
  description: "A Synth heart. It doesn't do anything interesting yet."
  components:
  - type: Organ
    slotId: heart
  - type: Heart
  - type: OrganHeartSynth
  - type: Sprite
    state: synth_heart
  - type: Metabolizer
    maxReagents: 2
    metabolizerTypes: [ Synth ]
    groups:
    - id: Medicine
    - id: Poison
    - id: Narcotic

- type: entity
  id: OrganSynthStomach
  parent: BaseSynthOrgan
  name: synth stomach
  suffix: Synth
  description: "A Synth stomach. It can convert minerals to nutriment and nutriment to nanites."
  components:
  - type: Organ
    slotId: stomach
  - type: Sprite
    state: synth_stomach
  - type: SolutionContainerManager
    solutions:
      stomach:
        maxVol: 50
      organ:
        reagents:
        - ReagentId: Nanites
          Quantity: 10
  - type: Stomach
  - type: Metabolizer
    maxReagents: 5
    metabolizerTypes: [ Synth ]
    groups:
    - id: Food
    - id: Drink

- type: entity
  id: OrganSynthLiver
  parent: BaseSynthOrgan
  name: synth liver
  suffix: Synth
  description: "A Synth liver. It prevents poisoning from alcohol and can convert ethanol to nutriment."
  components:
  - type: Organ
    slotId: liver
  - type: Liver
  - type: OrganLiverSynth
  - type: Sprite
    state: synth_liver
    scale: 0.8, 0.8
  - type: Metabolizer
    maxReagents: 1
    metabolizerTypes: [ Synth ]
    groups:
    - id: Alcohol

- type: entity
  id: OrganSynthKidneys
  parent: BaseSynthOrgan
  name: energy coil
  suffix: Synth
  description: "A Synth energy coil. It doesn't seem to do anything interesting yet."
  components:
  - type: Organ
    slotId: kidneys
  - type: Sprite
    state: synth_energy_coil
    scale: 1.1, 1.1
  - type: Metabolizer
    maxReagents: 5
    metabolizerTypes: [ Synth ]
    removeEmpty: true
