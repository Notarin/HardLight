- type: entity
  parent: [ClothingOuterStorageBase, AllowSuitStorageClothing, BaseC3Contraband] # HL: C3
  id: ClothingOuterCoatBlueShield
  name: blueshield overcoat
  description: A coat worn by Blueshield Officers who don't mind a little cold. Heavily reinforced, for when diplomacy won't cut it.
  components:
  - type: Sprite
    sprite: _Starlight/Clothing/OuterClothing/Coats/blueshield_coat.rsi
  - type: Clothing
    sprite: _Starlight/Clothing/OuterClothing/Coats/blueshield_coat.rsi
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.6
        Slash: 0.6
        Piercing: 0.6
        Heat: 0.7
  - type: ExplosionResistance
    damageCoefficient: 0.80
  - type: Item

# Security Windbreaker
- type: entity
  parent: [ClothingOuterStorageFoldableBase, AllowSuitStorageClothing, BaseSecurityContraband]
  id: ClothingOuterWindbreakerSecurity
  name: security windbreaker
  description: A stylish red windbreaker with additional inserted plate padding for security usage.
  components:
  - type: Sprite
    sprite: _Starlight/Clothing/OuterClothing/Coats/windbreaker_security.rsi
  - type: Clothing
    sprite: _Starlight/Clothing/OuterClothing/Coats/windbreaker_security.rsi
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.65
        Slash: 0.80
        Piercing: 0.70
        Heat: 0.90
  - type: ZombificationResistance
    zombificationResistanceCoefficient: 0.75

- type: entity
  parent: [ClothingOuterStorageFoldableBaseOpened, ClothingOuterWindbreakerSecurity]
  id: ClothingOuterWindbreakerSecurityOpened
  name: security windbreaker

