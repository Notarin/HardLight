name: YAML Linter
on:
  push:
    branches: [ master, staging, stable ]
  merge_group:
  pull_request:
    types: [ opened, reopened, synchronize, ready_for_review ]

jobs:
  build:
    name: YAML Linter
    if: forgejo.actor != 'PJBot' && forgejo.event.pull_request.draft == false && forgejo.actor != 'FrontierATC' # Frontier
    runs-on: ubuntu-latest
    container:
      image: node:20-bookworm
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup SS14
        uses: ./.github/actions/setup-ss14

      - name: Build
        run: dotnet build --configuration Release --no-restore /p:WarningsAsErrors= /m

      - name: Run Linter
        run: dotnet run --project Content.YAMLLinter/Content.YAMLLinter.csproj --no-build
