      # 70% chance of scrap of some kind
      weight: 70
      children:
      - !type:NestedSelector
        tableId: SalvageScrapLowValue
        weight: 60
      - !type:NestedSelector
        tableId: SalvageScrapHighValue
        weight: 30
      - !type:NestedSelector
        tableId: SalvageScrapLarge
        weight: 10
    - !type:NestedSelector
      # 10% chance of some trash
      tableId: GenericTrashItems
      weight: 10
    - !type:NestedSelector
      # 15% chance of low-value equipment
