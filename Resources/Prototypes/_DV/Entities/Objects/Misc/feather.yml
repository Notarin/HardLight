- type: entity
  parent: BaseItem
  id: AvaliFeather
  name: feather
  description: Probably not ethically sourced.
  components:
  - type: Appearance
  - type: Sprite
    sprite: _DV/Objects/Misc/feather.rsi
    layers:
    - state: feather
      map: [ "enum.FeatherVisualLayers.Feather" ]
    - state: featherblood
      color: "#FFFFFF00"
      map: [ "enum.FeatherVisualLayers.Blood"]
  - type: Flammable
    fireSpread: true
    alwaysCombustible: true
    damage:
      types:
        Heat: 1
  - type: FireVisuals
    sprite: Effects/fire.rsi
    normalState: fire
  - type: Damageable # a lot of this is sensible boilerplate from the Paper prototype
    damageModifierSet: Wood
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 15
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Item
    size: Tiny
  - type: Clothing
    sprite: _DV/Objects/Misc/feather.rsi
    # HardLight edit start - Add feathers to accessory slots (no visuals for accessory slots since they render as a lower layer - cant fix within scope)
    clothingVisuals:
      ears:
      - state: equipped-EARS
        map: [ "feather-ears" ]
      head:
      - state: equipped-HELMET
        map: [ "feather-head" ]
    slots:
    - ears
    - head
    - ACCESSORY
    - ACCESSORYALT
  # Hardlight edit end
  - type: Tag
    tags:
    - Write # Like a quill!
    - Pen
    - Trash
  # HardLight edit start - allow the feathers to be used for signing documents
  - type: UseDelay
    delays:
      stamp:
        length: 1.0
    delay: 1.5
  - type: Stamp
    stampedColor: "#333333"
    stampState: "paper_stamp-nf-signature"
    sound:
      path: /Audio/Items/Paper/paper_scribble1.ogg
      params:
        volume: -2
        maxDistance: 5
  # Hardlight edit end
  - type: Feather
