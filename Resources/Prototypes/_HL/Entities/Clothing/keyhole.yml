- type: entity
  parent: CoolCoyoteClothes
  id: KeyholeArmWarmers
  name: keyhole fabric arm warmers
  description: A cute pair of arm warmers made out of the same fabric as the beloved keyhole sweater.
  components:
  - type: Sprite
    overrideDir: South
    enableOverrideDir: true
    sprite: _HL/Clothing/Misc/keyhole_fabric.rsi
    layers:
    - state: keyholefabricarmwarmers
  - type: Clothing
    sprite: _HL/Clothing/Misc/keyhole_fabric.rsi
    clothingVisuals:
      gloves:
      - state: keyholefabricarmwarmers
    slots:
    - gloves

- type: entity
  parent: CoolCoyoteClothes
  id: KeyholeSocks
  name: keyhole fabric socks
  description: A cute pair of socks made out of the same fabric as the beloved keyhole sweater.
  components:
  - type: Sprite
    overrideDir: South
    enableOverrideDir: true
    sprite: _HL/Clothing/Misc/keyhole_fabric.rsi
    layers:
    - state: keyholefabricsocks
  - type: Clothing
    sprite: _HL/Clothing/Misc/keyhole_fabric.rsi
    clothingVisuals:
      shoes:
      - state: keyholefabricsocks
    slots:
    - FEET
  - type: ProtectedFromStepTriggers
  - type: FootstepModifier
    footstepSoundCollection:
      collection: BarestepHard
      params:
        volume: -6 # bit quieter than barefeet

