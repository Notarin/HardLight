# BASE
- type: entity
  parent: BaseItem
  id: BaseBoosterPack
  name: Booster Pack
  description: A sealed foil pack of randomized Ratvar's Row cards.
  abstract: true
  #  categories: [ HideSpawnMenu ]
  suffix: NPC Loot
  components:
  - type: Sprite
    sprite: _HL/Objects/Fun/ratvar.rsi
    state: booster_pack
  - type: StaticPrice
    price: 300
  - type: Item
    size: Normal

- type: entity
  id: BoosterPackTrash
  categories: [ HideSpawnMenu ]
  parent: BaseItem
  name: ripped booster pack
  description: Ceremoniously ripped apart and tossed on the floor.
  components:
  - type: Sprite
    sprite: _HL/Objects/Fun/ratvar.rsi
    state: booster_pack_trash
  - type: Tag
    tags:
    - Trash
  - type: SpaceGarbage

## Starter Pack
- type: entity
  parent: BaseBoosterPack
  id: StarterPack
  name: Starter Pack
  components:
  - type: StaticPrice
    price: 250
  - type: Sprite
    state: starter_booster_pack
  - type: SpawnItemsOnUse
    items:
    - id: BoosterPackTrash
    - id: Ratvar3123
    - id: Ratvar3222
    - id: Ratvar1414
    - id: Ratvar2561
    - id: Ratvar5545
    - id: PaperRatvarRules
    - id: RatvarBag
    sound:
      path: /Audio/_RMC14/Handling/paper_drop.ogg

- type: entity
  name: ratvar rules
  parent: Paper
  id: PaperRatvarRules # legally gray zone of using "D&D" and "DND"
  description: 'All the rules you need to play Ratvar'
  components:
  - type: Paper
    contentSize: 10000
    content: ratvar-rules
  - type: Sprite
    layers:
    - state: paper
      color: "#cccccc"
    - state: paper_words
      map: ["enum.PaperVisualLayers.Writing"]
      color: "#cccccc"
      visible: false
    - state: paper_stamp-generic
      map: ["enum.PaperVisualLayers.Stamp"]
      visible: false
  - type: PaperVisuals
    backgroundImagePath: "/Textures/Interface/Paper/paper_background_default.svg.96dpi.png"
    contentImagePath: "/Textures/Interface/Paper/paper_content_lined.svg.96dpi.png"
    backgroundModulate: "#cccccc"
    contentImageModulate: "#cccccc"
    backgroundPatchMargin: 16.0, 16.0, 16.0, 16.0
    contentMargin: 16.0, 16.0, 16.0, 16.0

## Booster Pack
- type: entity
  parent: BaseBoosterPack
  id: FunVendBoosterPack
  name: FunVend Booster Pack
  components:
  - type: Sprite
    layers:
    - state: booster_pack
    - state: booster_pack_overlay
      color: "#FFBF00"
  - type: SpawnItemsOnUse
    items:
    - id: BoosterPackTrash
    - id: Ratvar2322
    - id: Ratvar3143
    - id: Ratvar4434
    sound:
      path: /Audio/_RMC14/Handling/paper_drop.ogg

