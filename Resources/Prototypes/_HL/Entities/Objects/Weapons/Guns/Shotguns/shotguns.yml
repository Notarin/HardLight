- type: entity
  name: sawn-off triple-barrel shotgun (12 gauge)
  parent: [BaseWeaponShotgun, BaseC2ExpeditionContraband]
  id: WeaponShotgunTripleSawn
  description: A doubly modified civilian grade shotgun with a third barrel welded to the top of the mechanism. More is better, right?
  components:
  - type: Sprite
    sprite: _DV/Objects/Weapons/Guns/Shotguns/sawn.rsi
  - type: Clothing
    sprite: _DV/Objects/Weapons/Guns/Shotguns/sawn.rsi
  - type: Item
    size: Small
    sprite: _DV/Objects/Weapons/Guns/Shotguns/sawn.rsi
  - type: Gun
    fireRate: 3
  - type: BallisticAmmoProvider
    capacity: 3
  - type: DamageOtherOnHit
    damage:
      types:
        Blunt: 8

- type: entity
  name: Vortex-12
  parent: [ WeaponShotgunBulldog, BaseGunMeleeBlunt, BaseC2ExpeditionContraband ]
  id: WeaponShotgunVortex
  description: Designed by SESWC. A semi-automatic magazine-fed shotgun for close-quarters combat #with an auto magazine ejector
  components:
  - type: NFWeaponDetails
    manufacturer: weapon-details-manufacturer-SESWC-consortium
  - type: Sprite
    sprite: _HL/Objects/Weapons/Guns/Shotguns/vortex.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    sprite: Objects/Weapons/Guns/Shotguns/enforcer_inhands_64x.rsi
    size: Large
  - type: Clothing
    sprite: _HL/Objects/Weapons/Guns/Shotguns/vortex.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: AltFireMelee # Not using the gun melee based because this is a different damage type and need different rotation
    attackType: Light
  - type: MeleeRequiresWield
  - type: AmmoCounter
  - type: GunRequiresWield #remove when inaccuracy on spreads is fixed
  - type: Gun  # Have to do this to reduce the firerate
    fireRate: 1
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/shotgun.ogg
    soundEmpty:
      path: /Audio/Weapons/Guns/Empty/empty.ogg
  - type: Contraband # Try to do parent but bulldog override it thus This
    severity: Class1
    # Pretty much everyone.
    allowedDepartments: [ Civilian, Security, Command, Frontier, CentralCommand ]  #IF we had a merc department we can expand on it
  #- type: ChamberMagazineAmmoProvider
  #  autoEject: true  

- type: entity
  name: Forged Rambler Shotgun
  parent: [BaseGunWieldable, BaseWeaponRevolver, BaseC1Contraband]
  id: WeaponRamblerShotgun
  description: A ramshackle semi-automatic shotgun fed by revolving clamps. A curious mixture of shotgun and revolver, it reminds you of old subway tunnels for some reason.
  components:
  - type: Sprite
    sprite: _HL/Objects/Weapons/Guns/Shotguns/forgedrambler.rsi
    scale: 0.7, 0.7
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-unshaded-5
      map: ["enum.GunVisualLayers.MagUnshaded"]
      shader: unshaded
  - type: Item
    size: Large
    shape:
    - 0,0,5,2
    sprite: _HL/Objects/Weapons/Guns/Shotguns/forgedrambler_inhand.rsi 
  - type: Clothing
    sprite: _HL/Objects/Weapons/Guns/Shotguns/forgedrambler.rsi
    quickEquip: false 
    slots:
    - Back
    - suitStorage
  - type: GunRequiresWield
  - type: Gun
    fireRate: 2
    selectedMode: SemiAuto
    availableModes: 
    - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/shotgun.ogg
    soundEmpty:
      path: /Audio/Weapons/Guns/Empty/empty.ogg
  - type: RevolverAmmoProvider
    capacity: 6
    whitelist:
      tags:
        - ShellShotgun12_gauge
    chambers: [ True, True, True, True, True, True ]
    ammoSlots: [ null, null, null, null, null, null ]
    mayTransfer: true # Frontier
    proto: null
  - type: MagazineVisuals
    magState: mag
    sprite: _HL/Objects/Weapons/Guns/Shotguns/forgedrambler.rsi
    steps: 6
    zeroVisible: true

# Line Gun
- type: entity
  name: Line Gun
  parent: [BaseWeaponBattery, Welder, BaseC3Contraband]
  id: WeaponLineGun
  description: When Donk first designed the Plasma Cutter, it was intended for heating up food. When they realized it'd be a kick-ass hand-held semi-shotgun, they made this.
  components:
  - type: Sprite
    sprite: _HL/Objects/Weapons/Guns/Shotguns/linegun.rsi
    scale: 1.1, 1.1
    layers:
    - state: icon
    - state: line-gun-activate-icon
      visible: false
      shader: unshaded
      map: ["enum.ToggleVisuals.Layer"]
  - type: PointLight
    enabled: false
    radius: 1.5
    color: lightblue
  - type: Item
    size: Large
    sprite: _HL/Objects/Weapons/Guns/Shotguns/linegun.rsi
    shape:
    - 0,0,2,1
  - type: ToggleableLightVisuals
    spriteLayer: line-gun-activate-icon
    inhandVisuals:
      left:
      - state: line-glow-inhand-left
        shader: unshaded
      right:
      - state: line-glow-inhand-right
        shader: unshaded
  - type: Gun
    fireRate: 1
    soundGunshot:
      path:  /Audio/_HL/Weapons/Guns/Shotguns/line_gun.ogg
  - type: Battery
    maxCharge: 300
    startingCharge: 300
  - type: BatterySelfRecharger
    autoRecharge: true
    autoRechargeRate: 20
  - type: ProjectileBatteryAmmoProvider
    proto: LineGunShot
    fireCost: 100
  - type: Multishot
    spreadMultiplier: 1.0
  - type: SolutionContainerManager
    solutions:
      Welder:
        reagents:
        - ReagentId: WeldingFuel
          Quantity: 500
        maxVol: 500
  - type: SolutionRegeneration
    solution: Welder
    generated:
      reagents:
      - ReagentId: WeldingFuel
        Quantity: 0.1
  - type: Tool #Lets it rip up tiles
    qualities:
      - Axing
      - Welding
  - type: ToolTileCompatible